[project]
name = "kindle-to-anki-automation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0",
    "requests>=2.0",
    "gTTS>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["services"]
